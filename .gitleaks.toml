# Configuración de gitleaks: las reglas por defecto más UNA excepción angosta.
[extend]
useDefault = true

# Valores inventados que las pruebas usan a propósito para comprobar que un token nunca aparece en
# errores ni en la auditoría. Solo se ignoran en esos tres archivos y solo estos valores (la
# segunda cadena es la decodificación en base64 de la primera: gitleaks también la analiza).
[[allowlists]]
description = "Tokens de juguete de las pruebas de no-filtración de secretos"
condition = "AND"
paths = [
  '''^src/adaptadores/trabajos/error-seguro\.test\.ts$''',
  '''^src/adaptadores/trabajos/procesador\.test\.ts$''',
  '''^test/integracion/trabajos-cola\.test\.ts$''',
]
regexes = [
  '''^A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8S9t0-_$''',
  '''^Zm9vYmFyYmF6cXV4MTIzNDU2Nzg5MGFiY2RlZmdoaWo$''',
  '''^foobarbazqux1234567890abcdefghij$''',
]

# Valores inventados de las pruebas de saneamiento del adaptador de ARCA (F8): comprueban que un texto con
# <token>, <sign> o un bloque PEM sale tapado. Solo en este archivo y solo estos valores (el PEM de juguete es
# la prueba misma: «MIIEvQ» + el texto inventado, no una clave).
[[allowlists]]
description = "Valores de juguete de las pruebas de saneamiento de ARCA"
condition = "AND"
paths = [
  '''^src/adaptadores/arca/saneamiento\.test\.ts$''',
]
regexes = [
  '''^SECRETO-0123456789$''',
  '''(?s)^-----BEGIN PRIVATE KEY-----.*$''',
]

# ADR-016 (W5): la prueba de propiedades de `aRespuesta` mete una palabra inventada en fallas de todo tipo
# para comprobar que nunca sale hacia la pantalla. No es un secreto: un solo archivo y un solo valor.
# El valor se escribe con la sigla del producto de dos letras como comodín (`[A-Z]{2}`) a propósito: el historial
# conserva la forma anterior (`SECRETO-` + sigla vieja) en el mismo archivo, y el escaneo del historial completo
# tiene que seguir en verde con las dos.
[[allowlists]]
description = "Palabra de juguete de la prueba de no-filtración de aRespuesta"
condition = "AND"
paths = [
  '''^src/capacidades/experiencia/respuesta\.propiedades\.test\.ts$''',
]
regexes = [
  '''^SECRETO-[A-Z]{2}-9f3a$''',
]

# P8a (autenticación de plataforma): secretos de juguete de las pruebas del segundo factor y del entorno de
# plataforma (comprueban largo, variedad de caracteres y que ningún valor sale en una respuesta). No son
# secretos: tres archivos de prueba y solo estos valores exactos.
[[allowlists]]
description = "Secretos de juguete de las pruebas de autenticación de plataforma"
condition = "AND"
paths = [
  '''^src/capacidades/autenticacion/codigos-de-recuperacion\.test\.ts$''',
  '''^src/capacidades/autenticacion/totp\.test\.ts$''',
  '''^src/composicion/entorno-de-plataforma\.test\.ts$''',
]
regexes = [
  '''^secreto-de-prueba-0123456789abcdef$''',
  '''^\s*0123456789abcdef0123456789abcdef-plat\s*$''',
  '''^choque-vecinos-2882103$''',
]
