version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Espera 7 días antes de ofrecer un paquete recién publicado: frena paquetes maliciosos.
    cooldown:
      default-days: 7
    # Grupos: un PR por grupo en vez de uno por paquete. Un grupo captura cada paquete en el PRIMER grupo que lo nombra, así que el
    # orden importa. Previenen: `next` y `react` subían de a un workspace y abrían PR en rojo (deuda `dependabot-sin-agrupar`); el
    # #133 subió `@playwright/test` a 1.64.1 y dejó `playwright` en 1.63.0 (dos versiones del navegador en el mismo árbol).
    groups:
      marco-web:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom"]
      playwright:
        patterns:
          ["playwright", "@playwright/*", "@vitest/browser-playwright", "@axe-core/playwright"]
      desarrollo:
        dependency-type: development
    ignore:
      # Los tipos de Node tienen que coincidir con el Node que corre (24): subir a otra mayor
      # describiría funciones que el entorno de ejecución no tiene.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # `init` y `analyze` de CodeQL tienen que subir SIEMPRE juntos: con versiones desparejadas el análisis falla (#130 y #132
    # llegaron como PR separados). Las demás acciones, en un solo PR.
    groups:
      codeql:
        patterns: ["github/codeql-action/*"]
      acciones:
        patterns: ["*"]
