version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Espera 7 días antes de ofrecer un paquete recién publicado: frena paquetes maliciosos.
    cooldown:
      default-days: 7
    ignore:
      # Los tipos de Node tienen que coincidir con el Node que corre (24): subir a otra mayor
      # describiría funciones que el entorno de ejecución no tiene.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
