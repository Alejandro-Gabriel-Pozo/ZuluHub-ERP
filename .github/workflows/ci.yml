name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estatico:
    name: Estático (tipos, lint, formato, arquitectura, código muerto)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run arquitectura
      - run: npm run analizar:muerto

  pruebas:
    name: Pruebas (con Postgres real)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Misma versión mayor que Neon. Sin contraseña: es una base descartable del CI.
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRUEBAS_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  seguridad:
    name: Seguridad (dependencias)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  mutacion:
    name: Mutación (dinero e IVA)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mutacion
        env:
          FC_SEMILLA: "20261011"

  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [estatico, pruebas, seguridad, mutacion]
    if: always()
    steps:
      - name: Todos los jobs en verde
        run: |
          test "${{ needs.estatico.result }}" = "success"
          test "${{ needs.pruebas.result }}" = "success"
          test "${{ needs.seguridad.result }}" = "success"
          test "${{ needs.mutacion.result }}" = "success"
