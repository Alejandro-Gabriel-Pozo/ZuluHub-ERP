name: Gate rápido

# Aviso temprano para las ramas de trabajo (las de los agentes y las del dueño): cada vez que se empuja una
# rama, corre lo MÁS RÁPIDO del CI sobre el mismo entorno que el CI final (Postgres 18 en modo `trust`):
# verificación estática y todas las pruebas (con la integración). No incluye la mutación, las 12 copias de
# estabilidad ni la seguridad: eso corre en el pull request de integración de cada tanda (ci.yml). Las ramas
# `integracion/**` y `main` ya tienen su CI completo y no se repiten acá.
#
# Con un pull request abierto para la rama, `ci.yml` ya corre lo mismo en cada push: este aviso se saltea (job `hay-pr`: `omitir` es `true` solo si hay uno o más abiertos). Previene: pagar dos veces el estático y las
# pruebas de cada push a una rama con PR (los dos workflows corrían la misma suite: ~la mitad de las pruebas de cada PR, medido el 25/11/2026). Una rama sin PR conserva su
# aviso temprano. Ante la duda (la consulta falla, la salida viene vacía o no es un número) los jobs CORREN.

on:
  push:
    branches-ignore:
      - main
      - "integracion/**"
      - "dependabot/**"

permissions:
  contents: read

concurrency:
  group: gate-rapido-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hay-pr:
    name: ¿La rama ya tiene un pull request abierto?
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      omitir: ${{ steps.consulta.outputs.omitir }}
    steps:
      - id: consulta
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          DUENIO: ${{ github.repository_owner }}
          RAMA: ${{ github.ref_name }}
        run: |
          abiertos="$(gh api -X GET "repos/${REPOSITORIO}/pulls" -f head="${DUENIO}:${RAMA}" -f state=open --jq length)"
          case "${abiertos}" in
            "" | *[!0-9]* | 0) omitir=false ;;
            *) omitir=true ;;
          esac
          echo "omitir=${omitir}" >> "$GITHUB_OUTPUT"

  estatico:
    name: Estático (tipos, lint, formato, arquitectura, código muerto)
    needs: hay-pr
    if: ${{ !cancelled() && needs.hay-pr.outputs.omitir != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run arquitectura
      - run: npm run analizar:muerto

  pruebas:
    name: Pruebas (con Postgres real)
    needs: hay-pr
    if: ${{ !cancelled() && needs.hay-pr.outputs.omitir != 'true' }}
    runs-on: ubuntu-latest
    # Cuatro fragmentos de la suite en paralelo (`vitest` con `shard`, por archivo; cada uno con su propio Postgres): con un solo job la suite (17-20 min, p90 de 19-22) se cancelaba por timeout al borde del límite
    # (run 43989591478 del 17/11/2026: tres intentos de 20 min 16 s, 20 min 5 s y 19 min 27 s) y dejaba el PR «unstable». Con tres fragmentos cada uno tardaba ~10,6 min (mediana de 90 corridas: `npm test` 558 s más ~80 s de arranque) y pasó a ser el camino crítico al partir `recorrido`; con cuatro se esperan ~7-8 min (la suite se reparte casi pareja: ver `pruebas-en-shards.test.ts`); el tope de 20 es más del doble.
    # Chequeo: `gate-coincide-con-ci.test.ts` fija la matriz y el comando; `pruebas-en-shards.test.ts` comprueba con vitest de verdad que los fragmentos cubren cada archivo una sola vez.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        # Misma versión mayor que Neon. Sin contraseña: es una base descartable del CI.
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRUEBAS_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Registro de Postgres solo para fallos graves
        run: |
          psql "$PRUEBAS_DATABASE_URL" \
            -c "ALTER SYSTEM SET log_min_messages = 'fatal'" \
            -c "ALTER SYSTEM SET log_min_error_statement = 'panic'" \
            -c "ALTER SYSTEM SET max_locks_per_transaction = 256"
          docker restart $(docker ps --filter "ancestor=postgres:18" --format "{{.ID}}")
          for i in $(seq 1 60); do pg_isready -d "$PRUEBAS_DATABASE_URL" && break; sleep 1; done
          test "$(psql "$PRUEBAS_DATABASE_URL" -Atc "SHOW max_locks_per_transaction")" = "256"
      - run: npm test
        env:
          # El fragmento de este job (`i/n`): lo lee `vitest.config.ts` (`arquitectura/fragmento-de-pruebas.cjs`) y corre solo sus archivos; el total sale del tamaño de la matriz.
          PEDERNAL_FRAGMENTO: ${{ matrix.shard }}/${{ strategy.job-total }}

  web:
    name: Web y consola (next build sin variables PEDERNAL_*)
    needs: hay-pr
    if: ${{ !cancelled() && needs.hay-pr.outputs.omitir != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: El entorno no trae ninguna variable PEDERNAL_*
        run: |
          if env | grep -q '^PEDERNAL_'; then
            echo "El job web no debe tener variables PEDERNAL_*" >&2
            exit 1
          fi
      - run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run build:plataforma
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  componentes:
    name: Componentes (axe, foco y envío en Chromium)
    needs: hay-pr
    if: ${{ !cancelled() && needs.hay-pr.outputs.omitir != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Versión de Playwright (clave del caché del navegador)
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: navegador
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Chromium de Playwright
        if: steps.navegador.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias del sistema de Chromium (el navegador ya estaba en el caché)
        if: steps.navegador.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:componentes
